services:
  calling-automation:
    build: .
    image: salesgod-calling-automation:latest
    ports:
      - "8080:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - calling-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  calling-data:
